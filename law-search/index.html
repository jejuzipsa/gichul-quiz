<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="공인중개사 시험과 관련된 법률, 시행령, 시행규칙과 조문을 국가법령정보센터에서 검색합니다." />
  <title>법령 검색 | 공인중개사 기출문제</title>
  <script>
    try {
      const saved = localStorage.getItem('gichulQuizTheme');
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
        ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="../styles.css?v=2.22" />
  <link rel="stylesheet" href="law-search.css?v=2.22" />
  <script defer src="law-search.js?v=2.22"></script>
</head>
<body>
  <main class="app-shell law-page">
    <header class="law-topbar">
      <a class="law-home" href="../" aria-label="공인중개사 사이트 홈으로">← 홈</a>
      <h1>법령 검색</h1>
      <button type="button" id="lawThemeToggle" class="law-theme-btn" aria-label="테마 변경">테마 변경</button>
    </header>
    <section class="law-panel">
      <p class="eyebrow">국가법령정보센터 연동</p>
      <h2>법률·시행령·시행규칙 검색</h2>
      <p class="helper">법령명이나 조문 내용을 검색한 뒤 결과를 누르면 국가법령정보센터 원문으로 이동해.</p>
      <form id="lawSearchForm" class="law-search-form" action="./" method="get">
        <label for="lawQuery" class="sr-only">법령 검색어</label>
        <input id="lawQuery" name="q" type="search" minlength="2" maxlength="80" required autocomplete="off" placeholder="예: 중개대상물 확인 설명, 공인중개사법" />
        <button class="primary-btn" type="submit">검색</button>
      </form>
      <fieldset class="law-mode-group">
        <legend>검색 범위</legend>
        <label><input type="radio" name="mode" value="articles" form="lawSearchForm" checked /> 조문 내용</label>
        <label><input type="radio" name="mode" value="laws" form="lawSearchForm" /> 법령명</label>
      </fieldset>
      <div class="law-quick-links" aria-label="빠른 법령 검색">
        <span>자주 찾는 법령</span>
        <a href="?q=공인중개사법&mode=laws">공인중개사법</a>
        <a href="?q=민법&mode=laws">민법</a>
        <a href="?q=국토의 계획 및 이용에 관한 법률&mode=laws">국토계획법</a>
        <a href="?q=부동산등기법&mode=laws">부동산등기법</a>
        <a href="?q=지방세법&mode=laws">지방세법</a>
      </div>
    </section>
    <section class="law-results" aria-labelledby="lawResultsTitle">
      <div class="law-results-heading">
        <h2 id="lawResultsTitle">검색 결과</h2>
        <p id="lawStatus" aria-live="polite" role="status">검색어를 입력해 줘.</p>
      </div>
      <div id="lawResultList" class="law-result-list"></div>
      <nav id="lawPagination" class="law-pagination" aria-label="검색 결과 페이지"></nav>
    </section>
    <footer class="law-footer">
      <span>출처: 법제처 국가법령정보센터</span>
      <a id="lawOfficialSearch" href="https://www.law.go.kr/lsSc.do" target="_blank" rel="noopener noreferrer">국가법령정보센터에서 직접 검색 ↗</a>
      <p>법령은 시행 시점과 개정 여부에 따라 달라질 수 있어. 기출문제의 기준 연도와 구분해 확인해 줘.</p>
    </footer>
  </main>
</body>
</html>
