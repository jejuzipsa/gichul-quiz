<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf2f8">
<title>핵심요약</title>
<style>
:root{
 --bg:#eaf0f6;--paper:#fff;--soft:#f6f8fb;--text:#111827;--muted:#68768b;
 --line:#d4deeb;--blue:#1769ff;--blue2:#174cb8;--blueSoft:#eaf2ff;
 --green:#18794e;--greenSoft:#edf8f1;--red:#c64343;--redSoft:#fff1f1;
 --yellow:#9b6c00;--yellowSoft:#fff8e6;--shadow:0 18px 48px rgba(31,47,73,.12);
 --body:17px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
.viewer{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:10px;padding:max(9px,env(safe-area-inset-top)) 14px 9px;border-bottom:1px solid rgba(212,222,235,.9);background:rgba(234,240,246,.95);backdrop-filter:blur(14px);z-index:10}
.brand{flex:1;min-width:0}.brand small{display:block;color:var(--blue);font-size:11px;font-weight:900;margin-bottom:2px}.brand h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-tools{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:11px;background:#fff}.font-tools button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:850}.font-tools button.active{background:var(--blueSoft);color:var(--blue)}
.stage-wrap{min-height:0;display:grid;place-items:center;padding:14px}.stage{position:relative;width:min(1320px,100%);aspect-ratio:16/9;min-height:560px;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow);touch-action:pan-y}
.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:15px;padding:clamp(28px,3.5vw,48px);background:#fff}
.slide-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.kicker{margin:0 0 5px;color:var(--blue);font-size:12px;font-weight:900}.slide-title{margin:0;font-size:clamp(30px,3.4vw,46px);line-height:1.13;letter-spacing:-.04em}.slide-body{min-height:0;overflow:auto;scrollbar-width:thin}.foot{display:flex;align-items:center;justify-content:space-between;color:#98a2b1;font-size:10px}.foot b{color:#6d7a8e}
.cover,.chapter,.ending{padding:0;grid-template-rows:1fr;color:#fff;background:linear-gradient(135deg,#112c5e,#1769ff 72%,#62a2ff)}.chapter{background:linear-gradient(135deg,#183765,#2c63cf)}.ending{background:linear-gradient(135deg,#1d365d,#2359b7)}
.hero{position:relative;z-index:2;align-self:center;width:min(820px,78%);padding:clamp(38px,5vw,76px)}.hero-icon{display:grid;place-items:center;width:84px;height:84px;margin-bottom:20px;border:1px solid rgba(255,255,255,.3);border-radius:24px;background:rgba(255,255,255,.12);font-size:42px;font-weight:900}.hero h2{margin:0 0 12px;font-size:clamp(42px,5vw,68px);line-height:1.08;letter-spacing:-.05em}.hero p{margin:0;color:rgba(255,255,255,.84);font-size:clamp(16px,1.8vw,23px);line-height:1.5}
.section-slide{background:linear-gradient(135deg,#f8fbff,#eef4ff)}.section-inner{height:100%;display:grid;align-content:center;max-width:980px}.section-no{color:var(--blue);font-size:13px;font-weight:900}.section-title{margin:10px 0 0;font-size:clamp(36px,5vw,64px);line-height:1.12;letter-spacing:-.05em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;height:100%}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:100%}
.box{padding:21px;border:1.5px solid var(--line);border-radius:18px;background:var(--soft)}.box h3{margin:0 0 12px;font-size:22px}.box ul{margin:0;padding-left:20px;font-size:var(--body);line-height:1.7}.box li{margin:5px 0}.box.blue{background:#f1f6ff;border-color:#cad9f6}.box.green{background:#f0f8f3;border-color:#cbe4d4}.box.red{background:#fff4f4;border-color:#efcece}
.flow{height:100%;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.flow-step{min-width:145px;max-width:220px;padding:17px 14px;border:1.5px solid #cad7ee;border-radius:15px;background:#f4f8ff;text-align:center;font-size:17px;font-weight:850;line-height:1.35}.arr{font-size:26px;color:#9badc8}.lead{margin:0 0 12px;color:var(--muted);font-size:14px}
.table-wrap{max-height:100%;overflow:auto;border:1.5px solid var(--line);border-radius:16px}.ppt-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(12px,1.12vw,16px)}.ppt-table th{padding:10px 9px;border:1px solid #c9d4e4;background:#edf3fb;color:#26364f;font-weight:900}.ppt-table td{padding:9px;border:1px solid #d3dce8;vertical-align:middle;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}.ppt-table td:first-child{font-weight:780}.note{margin-top:8px;color:var(--muted);font-size:11px}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:stretch}.time{padding:16px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft)}.time strong{display:block;color:var(--blue2);font-size:15px}.time b{display:block;margin:6px 0;font-size:17px}.time span{color:var(--muted);font-size:12px;line-height:1.4}
.hierarchy-root{display:grid;place-items:center;width:160px;height:70px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,#1769ff,#5592ff);color:#fff;font-size:21px;font-weight:900}.hier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.hier{padding:17px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft)}.hier h3{margin:0 0 8px;color:var(--blue2)}.hier ul{margin:0;padding-left:18px;line-height:1.65;font-size:14px}
.auto-layout{display:grid;grid-template-columns:1fr;gap:11px}.auto-card{padding:16px 18px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft);font-size:var(--body);line-height:1.66}.auto-line{margin:0 0 5px;word-break:keep-all;overflow-wrap:anywhere}.auto-line:last-child{margin-bottom:0}.auto-line.h{margin-top:9px;color:var(--blue2);font-weight:900}.auto-line.b{padding-left:2px}.auto-line.note{padding:8px 10px;border-radius:9px;background:var(--yellowSoft);color:#4d4532}.auto-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.auto-table td{padding:8px;border:1px solid #d4dce8;vertical-align:top;line-height:1.4;word-break:keep-all}.auto-table tr:first-child td{background:#edf3fb;font-weight:850}
.bottom{display:flex;align-items:center;gap:8px;padding:9px 14px max(9px,env(safe-area-inset-bottom));border-top:1px solid rgba(212,222,235,.9);background:rgba(234,240,246,.95);backdrop-filter:blur(14px);z-index:10}.nav,.toc{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}.nav{min-width:78px}.toc{min-width:58px}.nav:disabled{opacity:.4}.counter{min-width:70px;text-align:center;color:#6d7b90;font-size:13px;font-weight:850}.progress{flex:1;height:7px;border-radius:999px;background:#d9e2ed;overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(18,28,46,.5);backdrop-filter:blur(8px)}.modal.hidden{display:none}.panel{width:min(940px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:20px;border-radius:22px;background:#fff;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel-head h2{margin:0}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.toc-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toc-item{padding:12px 13px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.toc-item strong{display:block}.toc-item span{display:block;margin-top:4px;color:var(--muted);font-size:11px}
@media(max-width:900px){
 .stage-wrap{padding:8px}.stage{width:100%;aspect-ratio:auto;min-height:calc(100dvh - 128px);border-radius:18px}.slide{padding:18px;gap:12px}.slide-title{font-size:clamp(27px,6.5vw,36px)}
 .grid2,.grid3{grid-template-columns:1fr;height:auto}.flow{align-items:stretch;justify-content:flex-start;flex-direction:column}.flow-step{width:100%;max-width:none}.arr{transform:rotate(90deg);align-self:center}
 .table-wrap{max-height:none;overflow-x:auto}.ppt-table{min-width:720px;font-size:13px}.timeline{grid-template-columns:1fr}.hero{width:94%;padding:30px 24px}.hero h2{font-size:42px}.hero-icon{width:68px;height:68px;font-size:34px}
 .toc-list{grid-template-columns:1fr}.auto-table{min-width:680px}.auto-layout .table-wrap{overflow-x:auto}
}
@media(max-width:560px){
 :root{--body:17px}.topbar{padding-inline:8px}.brand small{display:none}.brand h1{font-size:15px}.font-tools button{width:30px;height:30px;font-size:11px}
 .stage{min-height:calc(100dvh - 122px)}.slide{padding:15px}.slide-title{font-size:28px}.section-title{font-size:38px}.box{padding:16px}.box h3{font-size:20px}.auto-card{padding:14px}
 .bottom{padding-inline:8px}.nav{min-width:60px;padding-inline:8px}.progress{display:none}.counter{min-width:58px}
}
</style>
</head>
<body>
<div class="viewer">
<header class="topbar"><div class="brand"><small>핵심요약 · 슬라이드 · v1.43</small><h1 id="brand">불러오는 중...</h1></div><div class="font-tools"><button data-size="small">A−</button><button class="active" data-size="normal">A</button><button data-size="large">A+</button></div></header>
<main class="stage-wrap"><section id="stage" class="stage"></section></main>
<footer class="bottom"><button id="prev" class="nav">‹ 이전</button><button id="toc" class="toc">목차</button><div id="counter" class="counter"></div><div class="progress"><i id="bar"></i></div><button id="next" class="nav">다음 ›</button></footer>
</div>
<div id="modal" class="modal hidden"><div class="panel"><div class="panel-head"><h2>목차</h2><button id="close" class="close">✕</button></div><div id="tocList" class="toc-list"></div></div></div>
<script>
const params=new URLSearchParams(location.search);
const subject=params.get('subject')||'civil_law';
const allowed=new Set(['civil_law','brokerage_law','public_law','registration_law','tax_law']);
const safe=allowed.has(subject)?subject:'civil_law';
const sc=document.createElement('script');
sc.src=`${safe}_deck_v143.js`;
sc.onload=()=>startViewer();
sc.onerror=()=>{document.getElementById('brand').textContent='핵심요약을 불러오지 못했어';};
document.head.appendChild(sc);

function startViewer(){
const D=window.SUBJECT_DECK,S=document.getElementById('stage'),brand=document.getElementById('brand');
brand.textContent=D.name; document.title=D.name+' 핵심요약';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const foot=i=>`<div class="foot"><b>${esc(D.short||D.name)} 핵심요약</b><span>${i+1}</span></div>`;
const head=s=>`<div class="slide-head"><div><p class="kicker">${esc(s.chapter||s.section||D.short)}</p><h2 class="slide-title">${esc(s.title)}</h2></div></div>`;
const ul=arr=>`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
function hero(s,cls){return `<article class="slide ${cls}"><div class="hero"><div class="hero-icon">${esc(s.icon||D.icon)}</div><h2>${esc(s.title)}</h2><p>${esc(s.subtitle||'')}</p></div></article>`}
function pptTable(headers,rows){
 return `<div class="table-wrap"><table class="ppt-table">${headers?`<thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>`:''}<tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderAutoBlock(b){
 if(b.kind==='table') return `<div class="table-wrap"><table class="auto-table"><tbody>${b.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 const html=b.lines.map(raw=>{
   const t=raw.trim();
   if(!t)return '';
   let cls='auto-line';
   if(/^※/.test(t)) cls+=' note';
   else if(/^(\(\d+\)|\d+\)|[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮])/.test(t)) cls+=' h';
   else if(/^[-ㆍ·]/.test(t)) cls+=' b';
   return `<div class="${cls}">${esc(t)}</div>`;
 }).join('');
 return `<div class="auto-card">${html}</div>`;
}
function render(s,i){
 if(s.type==='cover'||s.type==='chapter'||s.type==='ending')return hero(s,s.type);
 if(s.type==='section')return `<article class="slide section-slide"><div class="section-inner"><span class="section-no">${esc(s.chapter)}</span><h2 class="section-title">${esc(s.title)}</h2></div>${foot(i)}</article>`;
 let body='';
 if(s.type==='auto') body=`<div class="auto-layout">${s.blocks.map(renderAutoBlock).join('')}</div>`;
 else if(s.type==='table') body=pptTable(s.headers,s.rows)+(s.note?`<div class="note">${esc(s.note)}</div>`:'');
 else if(s.type==='compare') body=`<div class="grid2"><section class="box blue"><h3>${esc(s.left.title)}</h3>${ul(s.left.items)}</section><section class="box green"><h3>${esc(s.right.title)}</h3>${ul(s.right.items)}</section></div>`;
 else if(s.type==='boxes') body=`<div class="${s.boxes.length===3?'grid3':'grid2'}">${s.boxes.map((b,j)=>`<section class="box ${['blue','green','red'][j%3]}"><h3>${esc(b.title)}</h3>${ul(b.items)}</section>`).join('')}</div>`;
 else if(s.type==='flow') body=`${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}<div class="flow">${s.steps.map((x,j)=>`${j?'<span class="arr">→</span>':''}<div class="flow-step">${esc(x)}</div>`).join('')}</div>`;
 else if(s.type==='timeline') body=`<div class="timeline">${s.items.map(x=>`<section class="time"><strong>${esc(x[0])}</strong><b>${esc(x[1])}</b><span>${esc(x[2]||'')}</span></section>`).join('')}</div>`;
 else if(s.type==='hierarchy') body=`<div class="hierarchy-root">${esc(s.root)}</div><div class="hier-grid">${s.groups.map(g=>`<section class="hier"><h3>${esc(g.name)}</h3>${ul(g.items)}</section>`).join('')}</div>`;
 return `<article class="slide">${head(s)}<div class="slide-body">${body}</div>${foot(i)}</article>`;
}
let idx=0,rendered=-1,tx=null,ty=null;
const prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),modal=document.getElementById('modal'),list=document.getElementById('tocList');
const key=`gichulSlideV143_${D.code}`;
function update(){idx=Math.max(0,Math.min(idx,D.slides.length-1));if(rendered!==idx){S.innerHTML=render(D.slides[idx],idx);rendered=idx}prev.disabled=idx===0;next.disabled=idx===D.slides.length-1;counter.textContent=`${idx+1} / ${D.slides.length}`;bar.style.width=`${((idx+1)/D.slides.length)*100}%`;try{localStorage.setItem(key,String(idx))}catch{}history.replaceState(null,'',`?subject=${encodeURIComponent(D.code)}#${idx+1}`)}
function go(n){let x=Math.max(0,Math.min(n,D.slides.length-1));if(x===idx)return;idx=x;rendered=-1;update()}
prev.onclick=()=>go(idx-1);next.onclick=()=>go(idx+1);document.getElementById('toc').onclick=()=>modal.classList.remove('hidden');document.getElementById('close').onclick=()=>modal.classList.add('hidden');modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')}
D.slides.forEach((s,i)=>{if(!['cover','chapter','section'].includes(s.type))return;let b=document.createElement('button');b.className='toc-item';b.innerHTML=`<strong>${esc(s.title)}</strong><span>${i+1} / ${D.slides.length}${s.chapter?' · '+esc(s.chapter):''}</span>`;b.onclick=()=>{modal.classList.add('hidden');go(i)};list.appendChild(b)})
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx-1);else if(e.key==='ArrowRight'||e.key===' ')go(idx+1);else if(e.key==='Escape')modal.classList.add('hidden')})
S.addEventListener('touchstart',e=>{let t=e.changedTouches[0];tx=t.clientX;ty=t.clientY},{passive:true});S.addEventListener('touchend',e=>{if(tx==null)return;let t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=ty=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)go(idx+(dx<0?1:-1))},{passive:true})
const sizes={small:'15px',normal:'17px',large:'20px'};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--body',sizes[b.dataset.size]);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));try{localStorage.setItem('gichulSlidesFontV143',b.dataset.size)}catch{}})
let start=Number(location.hash.slice(1))-1;if(!Number.isFinite(start)||start<0||start>=D.slides.length){try{start=Number(localStorage.getItem(key))}catch{start=0}}idx=Number.isFinite(start)&&start>=0&&start<D.slides.length?start:0;
try{let sz=localStorage.getItem('gichulSlidesFontV143')||'normal';if(sizes[sz]){document.documentElement.style.setProperty('--body',sizes[sz]);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x.dataset.size===sz))}}catch{}
update();
}
</script>
</body>
</html>
