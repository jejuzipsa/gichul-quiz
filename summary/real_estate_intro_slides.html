<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef3fb" />
  <title>부동산학개론 핵심요약</title>
  <style>
    :root {
      --bg: #edf2f8;
      --panel: #ffffff;
      --panel2: #f6f8fb;
      --text: #111827;
      --muted: #6b778c;
      --line: #d9e1ec;
      --blue: #2563eb;
      --blue2: #174cc2;
      --blueSoft: #eaf1ff;
      --greenSoft: #edf8ef;
      --yellowSoft: #fff7e8;
      --redSoft: #fff0f0;
      --shadow: 0 18px 45px rgba(36, 52, 79, .11);
      --bodySize: 17px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }
    button, select { font: inherit; }
    button { cursor: pointer; }

    .viewer {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      border-bottom: 1px solid rgba(217,225,236,.9);
      background: rgba(237,242,248,.93);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    .title-wrap { min-width: 0; flex: 1; }
    .eyebrow { margin: 0 0 2px; color: var(--blue); font-size: 11px; font-weight: 800; }
    .viewer-title {
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: clamp(16px, 2.2vw, 22px);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .tool-btn, .nav-btn, .toc-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
    }
    .tool-btn.active { background: var(--blueSoft); color: var(--blue); }
    .tool-btn:hover, .nav-btn:hover, .toc-btn:hover { background: var(--blueSoft); color: var(--blue); }

    .stage-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 14px;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(1280px, 100%);
      aspect-ratio: 16 / 9;
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      touch-action: pan-y;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: clamp(24px, 3vw, 42px);
      opacity: 0;
      transform: translateX(18px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .slide.active { opacity: 1; transform: none; pointer-events: auto; }

    .slide-head {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    .slide-kicker {
      margin: 0 0 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
    }
    .slide-title {
      margin: 0;
      font-size: clamp(26px, 3.3vw, 44px);
      line-height: 1.15;
      letter-spacing: -.035em;
    }
    .page-pill {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel2);
      font-size: 11px;
      font-weight: 750;
    }

    .slide-body {
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      padding-right: 2px;
    }

    .cards {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: stretch;
      gap: 14px;
    }
    .cards.count-1 { grid-template-columns: 1fr; }
    .cards.count-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }

    .card {
      min-width: 0;
      overflow: auto;
      padding: 18px 19px;
      border: 1.5px solid #cfd8e7;
      border-radius: 17px;
      background: var(--panel2);
      font-size: var(--bodySize);
      line-height: 1.65;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .card strong { color: var(--blue2); }
    .card-line { margin: 0 0 6px; }
    .card-line:last-child { margin-bottom: 0; }
    .card-line.note {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 9px;
      background: var(--yellowSoft);
    }
    .card-line.headline { margin-top: 8px; font-weight: 850; color: #23324d; }

    .source-foot {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .cover-slide {
      padding: 0;
      grid-template-rows: 1fr;
      color: #fff;
      background: #16213b;
    }
    .cover-photo, .divider-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover-overlay, .divider-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(12,24,48,.88) 0%, rgba(12,24,48,.67) 48%, rgba(12,24,48,.22) 100%);
    }
    .cover-content {
      position: relative;
      z-index: 2;
      align-self: center;
      width: min(720px, 72%);
      padding: clamp(34px, 5vw, 72px);
    }
    .cover-content .slide-title { font-size: clamp(38px, 5vw, 66px); }
    .cover-subtitle { margin: 16px 0 0; font-size: clamp(16px, 2vw, 24px); line-height: 1.55; color: rgba(255,255,255,.84); }
    .cover-badge {
      display: inline-flex;
      margin-bottom: 16px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      font-size: 12px;
      font-weight: 800;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 11px;
    }
    .overview-item {
      min-width: 0;
      padding: 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--panel2);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
    }

    .divider-slide {
      padding: 0;
      grid-template-rows: 1fr;
      background: linear-gradient(135deg,#18376f,#285cd6);
      color: white;
    }
    .divider-overlay {
      background: linear-gradient(90deg, rgba(16,38,80,.95), rgba(23,70,170,.72), rgba(23,70,170,.18));
    }
    .divider-content {
      position: relative;
      z-index: 2;
      align-self: center;
      width: min(760px, 76%);
      padding: clamp(36px, 5vw, 72px);
    }
    .divider-number { font-size: 13px; font-weight: 900; color: #b9d1ff; }
    .divider-title { margin: 10px 0; font-size: clamp(34px,4.4vw,58px); line-height:1.15; }
    .divider-subtitle { margin: 0; font-size: clamp(15px,1.8vw,21px); line-height:1.55; color:rgba(255,255,255,.82); }

    .formula-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 14px;
      align-items: stretch;
    }
    .formula-card {
      padding: 22px;
      border: 1.5px solid #c7d5ef;
      border-radius: 18px;
      background: linear-gradient(180deg,#f8fbff,#eef4ff);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 13px;
    }
    .formula-label { color: var(--blue2); font-size: 15px; font-weight: 900; }
    .formula-main {
      padding: 15px 12px;
      border: 1px solid #cbd8ee;
      border-radius: 12px;
      background: #fff;
      text-align: center;
      font-size: clamp(19px,2.3vw,30px);
      font-weight: 900;
      line-height: 1.35;
    }
    .formula-note { color: var(--muted); font-size: 14px; line-height: 1.55; }

    .compare-grid {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .compare-card {
      padding: 22px;
      border: 1.5px solid #ccd7e8;
      border-radius: 18px;
      background: var(--panel2);
    }
    .compare-card:first-child { background: #eff5ff; }
    .compare-card:last-child { background: #f4f8f1; }
    .compare-title { margin: 0 0 14px; font-size: 24px; }
    .compare-list { margin: 0; padding-left: 20px; font-size: var(--bodySize); line-height: 1.7; }
    .compare-list li { margin-bottom: 8px; }

    .theory-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 12px;
    }
    .theory-card {
      padding: 18px;
      border: 1.5px solid #cfd8e7;
      border-radius: 16px;
      background: var(--panel2);
    }
    .theory-name { margin: 0; color: var(--blue); font-size: 14px; font-weight: 900; }
    .theory-key { margin: 4px 0 8px; font-size: 20px; font-weight: 900; }
    .theory-desc { margin: 0; color: #48556c; font-size: 14px; line-height: 1.55; }

    .urban-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 14px;
    }
    .urban-card {
      padding: 18px;
      border: 1.5px solid #cfd8e7;
      border-radius: 17px;
      background: var(--panel2);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }
    .urban-card h3 { margin: 0; font-size: 19px; }
    .urban-card p { margin: 0; color: var(--muted); font-size: 13px; line-height:1.45; }
    .diagram {
      min-height: 190px;
      display: grid;
      place-items: center;
      position: relative;
    }
    .rings {
      width: 175px; height: 175px; border-radius: 50%;
      background:
        radial-gradient(circle, #2563eb 0 16%, #8db1ff 16% 31%, #d5e3ff 31% 48%, #dfe8d8 48% 65%, #f1e6c8 65% 82%, #faf7ef 82%);
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #cbd6e5;
    }
    .sector {
      width: 180px; height: 180px; border-radius: 50%;
      background: conic-gradient(#2563eb 0 55deg,#d9e5ff 55deg 115deg,#9fbaf5 115deg 170deg,#e7dbbd 170deg 230deg,#cfdcc8 230deg 360deg);
      clip-path: polygon(50% 50%, 100% 0, 100% 100%, 0 100%, 0 0);
      opacity: .95;
    }
    .nuclei { width: 185px; height: 185px; position: relative; border-radius: 22px; background: #f0f4fa; border: 1px dashed #bcc8da; }
    .nucleus { position:absolute; width:44px; height:44px; border-radius:50%; background:#2563eb; box-shadow:0 0 0 7px rgba(37,99,235,.12); }
    .nucleus:nth-child(1){left:25px;top:30px}.nucleus:nth-child(2){right:24px;top:40px}.nucleus:nth-child(3){left:70px;bottom:25px}.nucleus:nth-child(4){right:18px;bottom:22px;background:#7a9fe8}

    .valuation-grid {
      height:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;
    }
    .valuation-card {
      padding:22px; border:1.5px solid #cfd8e7; border-radius:18px; background:var(--panel2);
    }
    .valuation-card h3 { margin:0 0 8px; color:var(--blue2); font-size:24px; }
    .valuation-card .big { margin: 12px 0; font-size: 19px; font-weight:900; }
    .valuation-card ul { padding-left:20px; line-height:1.65; font-size:15px; }

    .bottom {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px max(9px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(217,225,236,.9);
      background: rgba(237,242,248,.95);
      backdrop-filter: blur(14px);
      z-index: 10;
    }
    .nav-btn, .toc-btn {
      height: 42px;
      border-color: var(--line);
      background: var(--panel);
      color: var(--text);
    }
    .nav-btn { min-width: 78px; }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .counter { min-width: 70px; text-align:center; color:var(--muted); font-size:13px; font-weight:800; }
    .progress { flex:1; height:7px; overflow:hidden; border-radius:999px; background:#dbe3ef; }
    .progress > i { display:block; height:100%; width:0; border-radius:inherit; background:var(--blue); transition:width .18s ease; }

    .toc-modal {
      position: fixed; inset: 0; z-index: 30;
      display: grid; place-items:center;
      padding: 16px;
      background: rgba(18,26,42,.45);
      backdrop-filter: blur(8px);
    }
    .toc-modal.hidden { display:none; }
    .toc-panel {
      width: min(900px, 100%);
      max-height: min(760px, calc(100dvh - 32px));
      overflow:auto;
      padding: 20px;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--panel);
      box-shadow:var(--shadow);
    }
    .toc-panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .toc-panel-head h2 { margin:0; }
    .close-btn { width:40px; height:40px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); }
    .toc-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .toc-item {
      min-width:0; padding:12px 13px; text-align:left;
      border:1px solid var(--line); border-radius:12px; background:var(--panel2);
    }
    .toc-item strong { display:block; margin-bottom:4px; }
    .toc-item span { color:var(--muted); font-size:11px; }

    @media (max-width: 820px) {
      .stage-wrap { padding: 8px; overflow: visible; }
      .stage {
        aspect-ratio: auto;
        min-height: calc(100dvh - 132px);
        width: 100%;
        border-radius: 18px;
      }
      .slide { padding: 18px; gap: 10px; }
      .slide-title { font-size: clamp(24px, 7vw, 34px); }
      .page-pill { font-size: 10px; }
      .cards, .cards.count-2, .cards.count-1 { grid-template-columns: 1fr; align-content:start; }
      .card { overflow: visible; font-size: var(--bodySize); padding: 15px; }
      .formula-grid, .compare-grid, .theory-grid, .urban-grid, .valuation-grid {
        grid-template-columns: 1fr;
        align-content:start;
        height:auto;
      }
      .formula-card, .compare-card, .theory-card, .urban-card, .valuation-card { min-height:0; }
      .diagram { min-height:150px; }
      .rings,.sector { width:140px;height:140px; }
      .nuclei { width:150px;height:150px; }
      .overview-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .cover-content, .divider-content { width: 92%; padding: 28px 24px; }
      .cover-content .slide-title { font-size: 40px; }
      .divider-title { font-size: 36px; }
      .cover-overlay, .divider-overlay { background: linear-gradient(180deg,rgba(12,24,48,.35),rgba(12,24,48,.88)); }
      .toc-list { grid-template-columns:1fr; }
    }

    @media (max-width: 560px) {
      :root { --bodySize: 17px; }
      .topbar { padding-inline: 8px; }
      .title-wrap .eyebrow { display:none; }
      .viewer-title { font-size: 15px; }
      .tool-group { gap:2px; padding:3px; }
      .tool-btn { min-width:30px; width:30px; padding:0; font-size:11px; }
      .stage { min-height: calc(100dvh - 126px); }
      .slide { padding: 15px; }
      .slide-head { gap:8px; }
      .page-pill { display:none; }
      .slide-title { font-size: 27px; }
      .card { line-height:1.7; }
      .overview-grid { grid-template-columns:1fr; }
      .bottom { padding-inline:8px; }
      .nav-btn { min-width:60px; padding-inline:8px; }
      .counter { min-width:58px; }
      .progress { display:none; }
      .toc-btn { min-width:52px; padding-inline:8px; }
    }
  </style>
</head>
<body>
<div class="viewer" id="viewer">
  <header class="topbar">
    <div class="title-wrap">
      <p class="eyebrow">핵심요약 · 슬라이드</p>
      <h1 class="viewer-title">부동산학개론</h1>
    </div>
    <div class="tool-group" aria-label="글자 크기">
      <button class="tool-btn" data-size="small" type="button">A−</button>
      <button class="tool-btn active" data-size="normal" type="button">A</button>
      <button class="tool-btn" data-size="large" type="button">A+</button>
    </div>
  </header>

  <main class="stage-wrap">
    <section class="stage" id="stage" aria-live="polite"></section>
  </main>

  <footer class="bottom">
    <button id="prevBtn" class="nav-btn" type="button">‹ 이전</button>
    <button id="tocBtn" class="toc-btn" type="button">목차</button>
    <div id="counter" class="counter">1 / 1</div>
    <div class="progress"><i id="progressBar"></i></div>
    <button id="nextBtn" class="nav-btn" type="button">다음 ›</button>
  </footer>
</div>

<div id="tocModal" class="toc-modal hidden" role="dialog" aria-modal="true" aria-labelledby="tocModalTitle">
  <div class="toc-panel">
    <div class="toc-panel-head">
      <h2 id="tocModalTitle">목차</h2>
      <button id="tocCloseBtn" class="close-btn" type="button" aria-label="목차 닫기">✕</button>
    </div>
    <div id="tocList" class="toc-list"></div>
  </div>
</div>

<script src="real_estate_intro_deck.js"></script>
<script>
(() => {
  const deck = window.REAL_ESTATE_INTRO_DECK;
  const stage = document.getElementById('stage');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const tocBtn = document.getElementById('tocBtn');
  const tocModal = document.getElementById('tocModal');
  const tocCloseBtn = document.getElementById('tocCloseBtn');
  const tocList = document.getElementById('tocList');
  const counter = document.getElementById('counter');
  const progressBar = document.getElementById('progressBar');
  const sizeButtons = [...document.querySelectorAll('[data-size]')];
  const sizeKey = 'gichulIntroSlideFontSize';
  const lastKey = 'gichulIntroSlideLastIndex';
  let index = 0;
  let renderedIndex = null;
  let touchX = null;
  let touchY = null;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  function lineHtml(text) {
    return esc(text).split('\n').map(raw => {
      const line = raw.trim();
      if (!line) return '<div class="card-line">&nbsp;</div>';
      let cls = 'card-line';
      if (/^※/.test(line)) cls += ' note';
      else if (/^(\(\d+\)|\d+\)|[①②③④⑤⑥⑦⑧⑨⑩])/.test(line)) cls += ' headline';
      return `<div class="${cls}">${esc(line)}</div>`;
    }).join('');
  }

  function photo(slide) {
    const url = slide.image && deck.photos[slide.image];
    return url ? `<img class="${slide.type === 'cover' ? 'cover-photo' : 'divider-photo'}" src="${esc(url)}" alt="" loading="eager">` : '';
  }

  function renderCover(slide) {
    return `<article class="slide cover-slide active">
      ${photo(slide)}
      <div class="cover-overlay"></div>
      <div class="cover-content">
        <span class="cover-badge">공인중개사 1차 · 제1과목</span>
        <h2 class="slide-title">${esc(slide.title)}</h2>
        <p class="cover-subtitle">${esc(slide.subtitle)}</p>
        <p class="source-foot" style="margin-top:22px;color:rgba(255,255,255,.68)">자료: ${esc(slide.source)} · 사진: Wikimedia Commons CC0</p>
      </div>
    </article>`;
  }

  function renderOverview(slide) {
    return `<article class="slide active">
      <div class="slide-head"><div><p class="slide-kicker">COURSE MAP</p><h2 class="slide-title">${esc(slide.title)}</h2></div><span class="page-pill">${esc(slide.source_pages)}</span></div>
      <div class="slide-body"><div class="overview-grid">${slide.items.map((it,i)=>`<div class="overview-item">${i+1}. ${esc(it.replace(/^\d+\.\s*/,''))}</div>`).join('')}</div></div>
      <div class="source-foot">자료: ${esc(deck.source)}</div>
    </article>`;
  }

  function renderDivider(slide) {
    return `<article class="slide divider-slide active">
      ${photo(slide)}
      <div class="divider-overlay"></div>
      <div class="divider-content">
        <div class="divider-number">${esc(slide.source_pages || '')}</div>
        <h2 class="divider-title">${esc(slide.title)}</h2>
        <p class="divider-subtitle">${esc(slide.subtitle || '')}</p>
        ${slide.image ? '<p class="source-foot" style="margin-top:20px;color:rgba(255,255,255,.66)">사진: Wikimedia Commons CC0</p>' : ''}
      </div>
    </article>`;
  }

  function renderCards(slide) {
    const count = Math.min(slide.cards.length, 3);
    return `<article class="slide active">
      <div class="slide-head"><div><p class="slide-kicker">${esc(slide.chapter)}</p><h2 class="slide-title">${esc(slide.title)}</h2></div><span class="page-pill">${esc(slide.source_pages)}</span></div>
      <div class="slide-body"><div class="cards count-${count}">${slide.cards.map(c=>`<section class="card">${lineHtml(c)}</section>`).join('')}</div></div>
      <div class="source-foot">자료: ${esc(deck.source)}</div>
    </article>`;
  }

  function renderFormula(slide) {
    return `<article class="slide active">
      <div class="slide-head"><div><p class="slide-kicker">${esc(slide.chapter)}</p><h2 class="slide-title">${esc(slide.title)}</h2></div><span class="page-pill">${esc(slide.source_pages)}</span></div>
      <div class="slide-body"><div class="formula-grid">${slide.cards.map(c=>`<section class="formula-card"><div class="formula-label">${esc(c.label)}</div><div class="formula-main">${esc(c.formula)}</div><div class="formula-note">${esc(c.note)}</div></section>`).join('')}</div></div>
      <div class="source-foot">자료: ${esc(deck.source)}</div>
    </article>`;
  }

  function renderCompare(slide) {
    const box = side => `<section class="compare-card"><h3 class="compare-title">${esc(side.title)}</h3><ul class="compare-list">${side.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;
    return `<article class="slide active">
      <div class="slide-head"><div><p class="slide-kicker">${esc(slide.chapter)}</p><h2 class="slide-title">${esc(slide.title)}</h2></div><span class="page-pill">${esc(slide.source_pages)}</span></div>
      <div class="slide-body"><div class="compare-grid">${box(slide.left)}${box(slide.right)}</div></div>
      <div class="source-foot">자료: ${esc(deck.source)}</div>
    </article>`;
  }

  function renderTheoryCards(slide) {
    return `<article class="slide active">
      <div class="slide-head"><div><p class="slide-kicker">${esc(slide.chapter)}</p><h2 class="slide-title">${esc(slide.title)}</h2></div><span class="page-pill">${esc(slide.source_pages)}</span></div>
      <div class="slide-body"><div class="theory-grid">${slide.cards.map(c=>`<section class="theory-card"><p class="theory-name">${esc(c.name)}</p><div class="theory-key">${esc(c.key)}</div><p class="theory-desc">${esc(c.desc)}</p></section>`).join('')}</div></div>
      <div class="source-foot">자료: ${esc(deck.source)}</div>
    </article>`;
  }

  function renderUrban(slide) {
    return `<article class="slide active">
      <div class="slide-head"><div><p class="slide-kicker">${esc(slide.chapter)}</p><h2 class="slide-title">${esc(slide.title)}</h2></div><span class="page-pill">${esc(slide.source_pages)}</span></div>
      <div class="slide-body"><div class="urban-grid">
        <section class="urban-card"><h3>버제스 · 동심원이론</h3><div class="diagram"><div class="rings"></div></div><p>중심업무지구 → 천이지대 → 근로자 주택지대 → 중산층 주택지대 → 통근자 지대</p></section>
        <section class="urban-card"><h3>호이트 · 선형이론</h3><div class="diagram"><div class="sector"></div></div><p>도로망을 따라 동질적 토지이용이 부채꼴 모양으로 확장</p></section>
        <section class="urban-card"><h3>다핵심이론</h3><div class="diagram"><div class="nuclei"><i class="nucleus"></i><i class="nucleus"></i><i class="nucleus"></i><i class="nucleus"></i></div></div><p>도시가 성장하면서 여러 개의 분리된 핵심으로 구성</p></section>
      </div></div>
      <div class="source-foot">자료: ${esc(deck.source)}</div>
    </article>`;
  }

  function renderValuation(slide) {
    return `<article class="slide active">
      <div class="slide-head"><div><p class="slide-kicker">${esc(slide.chapter)}</p><h2 class="slide-title">${esc(slide.title)}</h2></div><span class="page-pill">${esc(slide.source_pages)}</span></div>
      <div class="slide-body"><div class="valuation-grid">
        <section class="valuation-card"><h3>원가방식</h3><div class="big">비용성</div><ul><li>원가법 → 적산가치</li><li>적산법 → 적산임료</li><li>공급가격 측면</li></ul></section>
        <section class="valuation-card"><h3>비교방식</h3><div class="big">시장성</div><ul><li>거래사례비교법 → 비준가치</li><li>임대사례비교법 → 비준임료</li><li>시장가격 측면</li></ul></section>
        <section class="valuation-card"><h3>수익방식</h3><div class="big">수익성</div><ul><li>수익환원법 → 수익가치</li><li>수익분석법 → 수익임료</li><li>수요가격 측면</li></ul></section>
      </div></div>
      <div class="source-foot">자료: ${esc(deck.source)}</div>
    </article>`;
  }

  function htmlFor(slide) {
    switch(slide.type) {
      case 'cover': return renderCover(slide);
      case 'overview': return renderOverview(slide);
      case 'divider': return renderDivider(slide);
      case 'formula': return renderFormula(slide);
      case 'compare': return renderCompare(slide);
      case 'theory_cards': return renderTheoryCards(slide);
      case 'urban_theory': return renderUrban(slide);
      case 'valuation': return renderValuation(slide);
      default: return renderCards(slide);
    }
  }

  function update() {
    index = Math.max(0, Math.min(index, deck.slides.length - 1));
    if (renderedIndex !== index) {
      stage.innerHTML = htmlFor(deck.slides[index]);
      renderedIndex = index;
      stage.scrollTop = 0;
    }
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === deck.slides.length - 1;
    counter.textContent = `${index + 1} / ${deck.slides.length}`;
    progressBar.style.width = `${((index + 1) / deck.slides.length) * 100}%`;
    try { localStorage.setItem(lastKey, String(index)); } catch {}
    history.replaceState(null, '', `#${index + 1}`);
  }

  function go(next) {
    const clamped = Math.max(0, Math.min(next, deck.slides.length - 1));
    if (clamped === index) return;
    index = clamped;
    renderedIndex = null;
    update();
  }

  function buildToc() {
    tocList.innerHTML = '';
    let lastChapter = '';
    deck.slides.forEach((slide, i) => {
      if (slide.type !== 'divider' && slide.type !== 'cover' && slide.type !== 'overview') return;
      const btn = document.createElement('button');
      btn.className = 'toc-item';
      btn.type = 'button';
      btn.innerHTML = `<strong>${esc(slide.title)}</strong><span>${i + 1} / ${deck.slides.length}${slide.source_pages ? ' · ' + esc(slide.source_pages) : ''}</span>`;
      btn.addEventListener('click', () => {
        tocModal.classList.add('hidden');
        go(i);
      });
      tocList.appendChild(btn);
      lastChapter = slide.chapter || slide.title;
    });
  }

  function setSize(size, persist=true) {
    const val = size === 'small' ? '15px' : size === 'large' ? '20px' : '17px';
    document.documentElement.style.setProperty('--bodySize', val);
    sizeButtons.forEach(b => b.classList.toggle('active', b.dataset.size === size));
    if (persist) { try { localStorage.setItem(sizeKey, size); } catch {} }
  }

  prevBtn.addEventListener('click', () => go(index - 1));
  nextBtn.addEventListener('click', () => go(index + 1));
  tocBtn.addEventListener('click', () => tocModal.classList.remove('hidden'));
  tocCloseBtn.addEventListener('click', () => tocModal.classList.add('hidden'));
  tocModal.addEventListener('click', e => { if (e.target === tocModal) tocModal.classList.add('hidden'); });
  sizeButtons.forEach(btn => btn.addEventListener('click', () => setSize(btn.dataset.size)));

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(index - 1);
    else if (e.key === 'ArrowRight' || e.key === ' ') go(index + 1);
    else if (e.key === 'Escape') tocModal.classList.add('hidden');
  });

  stage.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchX = t.clientX;
    touchY = t.clientY;
  }, {passive:true});

  stage.addEventListener('touchend', e => {
    if (touchX == null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchX;
    const dy = t.clientY - touchY;
    touchX = touchY = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.25) {
      if (dx < 0) go(index + 1);
      else go(index - 1);
    }
  }, {passive:true});

  let initial = Number(location.hash.replace('#','')) - 1;
  if (!Number.isFinite(initial) || initial < 0 || initial >= deck.slides.length) {
    try { initial = Number(localStorage.getItem(lastKey)); } catch { initial = 0; }
  }
  index = Number.isFinite(initial) && initial >= 0 && initial < deck.slides.length ? initial : 0;

  let savedSize = 'normal';
  try { savedSize = localStorage.getItem(sizeKey) || 'normal'; } catch {}
  setSize(['small','normal','large'].includes(savedSize) ? savedSize : 'normal', false);

  buildToc();
  update();
})();
</script>
</body>
</html>
