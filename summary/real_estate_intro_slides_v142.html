<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f8">
<title>부동산학개론 핵심요약</title>
<style>
:root{
  --bg:#eaf0f6;--paper:#fff;--soft:#f5f8fc;--text:#101827;--muted:#6b778b;
  --line:#d4deeb;--blue:#1769ff;--blue2:#174cb8;--blueSoft:#eaf2ff;
  --green:#18794e;--greenSoft:#eaf8f0;--red:#c94343;--redSoft:#fff0f0;
  --yellow:#9a6b00;--yellowSoft:#fff8e4;--shadow:0 18px 46px rgba(31,47,73,.12);
  --body:17px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
.viewer{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:10px;padding:max(9px,env(safe-area-inset-top)) 14px 9px;border-bottom:1px solid rgba(212,222,235,.9);background:rgba(234,240,246,.94);backdrop-filter:blur(14px);z-index:20}
.brand{flex:1;min-width:0}.brand small{display:block;color:var(--blue);font-size:11px;font-weight:900;margin-bottom:2px}.brand h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-tools{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:11px;background:#fff}
.font-tools button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:850}.font-tools button.active{background:var(--blueSoft);color:var(--blue)}
.stage-wrap{min-height:0;display:grid;place-items:center;padding:14px}
.stage{position:relative;width:min(1320px,100%);aspect-ratio:16/9;min-height:560px;border:1px solid var(--line);border-radius:24px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y}
.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:16px;padding:clamp(28px,3.5vw,48px);background:#fff}
.slide-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.kicker{margin:0 0 5px;color:var(--blue);font-size:12px;font-weight:900}
.slide-title{margin:0;font-size:clamp(30px,3.6vw,48px);line-height:1.12;letter-spacing:-.04em}
.slide-body{min-height:0;overflow:hidden}
.slide-foot{display:flex;align-items:center;justify-content:space-between;color:#99a3b2;font-size:10px}
.slide-foot b{color:#6f7b90}
.cover,.chapter,.ending{padding:0;grid-template-rows:1fr;color:#fff;background:#16233e}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,21,43,.92),rgba(12,37,82,.73) 55%,rgba(14,49,111,.20))}
.hero-content{position:relative;z-index:2;align-self:center;width:min(820px,72%);padding:clamp(38px,5vw,76px)}
.hero-badge{display:inline-flex;padding:8px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;font-weight:850}
.hero-title{margin:16px 0 10px;font-size:clamp(42px,5vw,70px);line-height:1.08;letter-spacing:-.05em}
.hero-sub{margin:0;color:rgba(255,255,255,.84);font-size:clamp(17px,1.9vw,24px);line-height:1.5}
.hero-note{margin:18px 0 0;color:rgba(255,255,255,.64);font-size:13px;line-height:1.5}
.grid-2{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-3{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.box{min-width:0;padding:22px;border:1.5px solid var(--line);border-radius:19px;background:var(--soft)}
.box.blue{background:#f2f7ff;border-color:#c9d9f7}.box.green{background:#f0f8f3;border-color:#c9e3d3}.box.red{background:#fff4f4;border-color:#efcdcd}.box.yellow{background:#fff9eb;border-color:#eadfbf}
.box h3{margin:0 0 13px;font-size:23px}.box ul{margin:0;padding-left:20px;font-size:var(--body);line-height:1.7}.box li{margin:6px 0}
.flow{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.flow-step{min-width:155px;max-width:240px;padding:18px 16px;border:1.5px solid #cbd8ef;border-radius:16px;background:#f4f8ff;text-align:center;font-size:18px;font-weight:850;line-height:1.35}.flow-arrow{font-size:28px;color:#9eb0cb}
.note-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.note-pill{padding:9px 12px;border-radius:999px;background:#f1f4f8;color:#41506a;font-size:13px;font-weight:750}
.table-wrap{height:100%;overflow:hidden;border:1.5px solid var(--line);border-radius:16px}.ppt-table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(12px,1.15vw,16px)}.ppt-table th{padding:11px 9px;border:1px solid #c9d4e4;background:#edf3fb;color:#25344d;font-weight:900}.ppt-table td{padding:10px 9px;border:1px solid #d2dbe8;vertical-align:middle;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}.ppt-table td:first-child{font-weight:780}.ppt-table .em{background:#f6f9fd;font-weight:800}
.table-note{margin-top:9px;color:var(--muted);font-size:12px}
.concept-map{height:100%;display:grid;grid-template-columns:1fr 150px 1fr;gap:18px;align-items:center}.concept-center{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#1769ff,#4a8aff);color:#fff;font-size:26px;font-weight:900;box-shadow:0 12px 30px rgba(23,105,255,.25)}.concept-branch{height:80%;padding:22px;border:1.5px solid var(--line);border-radius:20px;background:var(--soft)}.concept-branch h3{margin:0 0 12px;font-size:23px}.concept-branch ul{margin:0;padding-left:19px;line-height:1.7;font-size:var(--body)}.concept-label{display:inline-flex;margin-top:14px;padding:7px 10px;border-radius:999px;background:var(--blueSoft);color:var(--blue2);font-size:12px;font-weight:850}
.term-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;height:100%;align-content:stretch}.term-card{padding:17px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft)}.term-card h3{margin:0 0 8px;color:var(--blue2);font-size:19px}.term-card p{margin:0;color:#42506a;font-size:14px;line-height:1.55}
.feature-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;height:100%}.feature-card{padding:16px;border:1.5px solid #cfd9e8;border-radius:16px;background:#f7f9fc}.feature-card h3{margin:0;color:var(--blue);font-size:19px}.feature-card .sub{margin:4px 0 11px;color:#7a879a;font-size:12px;font-weight:700}.feature-card ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.formula-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:100%}.formula-card{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:22px;border:1.5px solid #c9d7ef;border-radius:18px;background:linear-gradient(180deg,#f8fbff,#eef4ff)}.formula-label{color:var(--blue2);font-weight:900}.formula-main{padding:17px 12px;border:1px solid #cad6e8;border-radius:12px;background:#fff;text-align:center;font-size:clamp(18px,2.1vw,29px);font-weight:900;line-height:1.35}.formula-note{color:#59677e;font-size:14px;line-height:1.55}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;height:100%;align-items:center}.time-card{padding:18px;border:1.5px solid var(--line);border-radius:18px;background:var(--soft)}.time-card h3{margin:0 0 5px;font-size:19px}.time-period{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--blueSoft);color:var(--blue2);font-size:12px;font-weight:850}.time-card p{margin:12px 0 0;color:#4d5a70;font-size:13px;line-height:1.5}
.cobweb-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:18px;height:100%}.assume{padding:22px;border:1.5px solid var(--line);border-radius:18px;background:var(--soft)}.assume h3{margin:0 0 12px}.assume ul{margin:0;padding-left:20px;line-height:1.7}.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.case{padding:18px;border:1.5px solid #cad7e9;border-radius:17px;background:#f7faff;display:flex;flex-direction:column;justify-content:center}.case h3{margin:0 0 7px;color:var(--blue2)}.case strong{font-size:15px}.case span{margin-top:10px;color:#6a778c;font-size:12px}
.theory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;height:100%}.theory-card{padding:18px;border:1.5px solid var(--line);border-radius:17px;background:var(--soft)}.theory-card .name{color:var(--blue);font-size:13px;font-weight:900}.theory-card h3{margin:5px 0 8px;font-size:21px}.theory-card p{margin:0;color:#4f5d72;font-size:14px;line-height:1.55}
.urban-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:100%}.urban-card{display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:18px;border:1.5px solid var(--line);border-radius:18px;background:var(--soft)}.urban-card h3{margin:0;font-size:20px}.urban-card p{margin:0;color:#5b687b;font-size:13px;line-height:1.5}.diagram{display:grid;place-items:center;min-height:210px}.rings{width:185px;height:185px;border-radius:50%;background:radial-gradient(circle,#1769ff 0 15%,#7aa6ff 15% 31%,#c9dbff 31% 48%,#dbe5d3 48% 65%,#efe0bb 65% 82%,#faf7ef 82%);box-shadow:0 0 0 1px #cbd6e5}.sector{width:185px;height:185px;border-radius:50%;background:conic-gradient(#1769ff 0 55deg,#d8e5ff 55deg 115deg,#93b3f5 115deg 170deg,#eadbb2 170deg 230deg,#ccd9c4 230deg 360deg)}.nuclei{width:190px;height:190px;position:relative;border:1px dashed #b9c7da;border-radius:22px;background:#f0f4f9}.nucleus{position:absolute;width:45px;height:45px;border-radius:50%;background:#1769ff;box-shadow:0 0 0 8px rgba(23,105,255,.12)}.nucleus:nth-child(1){left:25px;top:28px}.nucleus:nth-child(2){right:24px;top:42px}.nucleus:nth-child(3){left:72px;bottom:24px}.nucleus:nth-child(4){right:18px;bottom:18px;background:#7198e4}
.cashflow{height:100%;display:flex;flex-direction:column;justify-content:center;gap:8px}.cash-row{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:center;padding:11px 15px;border:1.5px solid var(--line);border-radius:13px;background:var(--soft)}.cash-row b{font-size:15px}.cash-row span{color:var(--blue2);font-weight:850}
.principle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;height:100%}.principle{padding:15px;border:1.5px solid var(--line);border-radius:15px;background:var(--soft)}.principle h3{margin:0 0 5px;color:var(--blue2);font-size:17px}.principle p{margin:0;color:#536177;font-size:13px;line-height:1.5}
.val-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:100%}.val-card{padding:22px;border:1.5px solid var(--line);border-radius:18px;background:var(--soft)}.val-card h3{margin:0;color:var(--blue2);font-size:25px}.val-card .theme{margin:8px 0 14px;font-size:18px;font-weight:900}.val-card ul{margin:0;padding-left:19px;line-height:1.7;font-size:15px}
.tax-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tax-card{padding:17px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft)}.tax-card h3{margin:0 0 8px}.tax-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #e2e7ef;font-size:14px}.tax-line:first-of-type{border-top:0}.down{color:var(--green);font-weight:900}.up{color:var(--red);font-weight:900}
.bottom{display:flex;align-items:center;gap:8px;padding:9px 14px max(9px,env(safe-area-inset-bottom));border-top:1px solid rgba(212,222,235,.9);background:rgba(234,240,246,.95);backdrop-filter:blur(14px);z-index:20}.nav,.toc{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-weight:800}.nav{min-width:78px}.toc{min-width:58px}.nav:disabled{opacity:.4}.count{min-width:70px;text-align:center;color:#6e7c91;font-size:13px;font-weight:800}.progress{flex:1;height:7px;border-radius:999px;background:#d8e1ec;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:inherit;transition:width .16s}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(17,27,45,.48);backdrop-filter:blur(8px)}.modal.hidden{display:none}.modal-panel{width:min(900px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:20px;border-radius:22px;background:#fff;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.modal-head h2{margin:0}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.toc-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toc-item{padding:12px 13px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.toc-item strong{display:block}.toc-item span{display:block;margin-top:4px;color:var(--muted);font-size:11px}
@media(max-width:900px){
  .stage-wrap{padding:8px;overflow:visible}.stage{width:100%;aspect-ratio:auto;min-height:calc(100dvh - 128px);border-radius:18px;overflow:hidden}
  .slide{padding:18px;gap:12px}.slide-body{overflow:auto}.slide-title{font-size:clamp(26px,6.5vw,36px)}
  .grid-2,.grid-3,.term-grid,.feature-grid,.formula-grid,.timeline,.theory-grid,.urban-grid,.principle-grid,.val-grid,.concept-map,.cobweb-grid{grid-template-columns:1fr;height:auto}
  .concept-center{display:none}.concept-branch{height:auto}.box,.term-card,.feature-card,.formula-card,.theory-card,.urban-card,.principle,.val-card{min-height:0}
  .table-wrap{height:auto;overflow-x:auto}.ppt-table{min-width:720px;height:auto;font-size:13px}.ppt-table th,.ppt-table td{padding:9px 8px}
  .flow{align-items:stretch;justify-content:flex-start;flex-direction:column}.flow-step{max-width:none;width:100%}.flow-arrow{transform:rotate(90deg);align-self:center}
  .cases{grid-template-columns:1fr}.tax-grid{grid-template-columns:1fr}.hero-content{width:92%;padding:28px 23px}.hero-title{font-size:42px}.hero-overlay{background:linear-gradient(180deg,rgba(8,21,43,.35),rgba(8,21,43,.9))}
  .toc-list{grid-template-columns:1fr}
}
@media(max-width:560px){
  :root{--body:17px}.topbar{padding-inline:8px}.brand small{display:none}.brand h1{font-size:15px}.font-tools button{width:30px;height:30px;font-size:11px}
  .stage{min-height:calc(100dvh - 122px)}.slide{padding:15px}.slide-title{font-size:28px}.kicker{font-size:11px}.slide-foot{font-size:9px}
  .box{padding:16px}.box h3{font-size:20px}.term-grid,.theory-grid{gap:9px}.term-card{padding:14px}
  .bottom{padding-inline:8px}.nav{min-width:60px;padding-inline:8px}.progress{display:none}.count{min-width:58px}
}
</style>
</head>
<body>
<div class="viewer">
<header class="topbar">
  <div class="brand"><small>핵심요약 · 슬라이드 · v1.42</small><h1>부동산학개론</h1></div>
  <div class="font-tools">
    <button data-size="small">A−</button><button data-size="normal" class="active">A</button><button data-size="large">A+</button>
  </div>
</header>
<main class="stage-wrap"><section id="stage" class="stage"></section></main>
<footer class="bottom">
  <button id="prev" class="nav">‹ 이전</button>
  <button id="toc" class="toc">목차</button>
  <div id="count" class="count"></div>
  <div class="progress"><i id="bar"></i></div>
  <button id="next" class="nav">다음 ›</button>
</footer>
</div>
<div id="modal" class="modal hidden">
  <div class="modal-panel">
    <div class="modal-head"><h2>목차</h2><button id="close" class="close">✕</button></div>
    <div id="tocList" class="toc-list"></div>
  </div>
</div>
<script src="real_estate_intro_deck_v142.js"></script>
<script>
(()=>{
const D=window.REAL_ESTATE_INTRO_DECK,S=document.getElementById('stage');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const img=s=>s.image&&D.images[s.image]?`<img class="hero-img" src="${esc(D.images[s.image])}" alt="">`:'';
const foot=(i)=>`<div class="slide-foot"><b>부동산학개론 핵심요약</b><span>${i+1}</span></div>`;
function cell(x){if(typeof x==='string')return `<td>${esc(x)}</td>`;return `<td${x.rowspan?` rowspan="${x.rowspan}"`:''}${x.colspan?` colspan="${x.colspan}"`:''}${x.class?` class="${x.class}"`:''}>${esc(x.text)}</td>`}
function head(s){return `<div class="slide-head"><div><p class="kicker">${esc(s.chapter||'부동산학개론')}</p><h2 class="slide-title">${esc(s.title)}</h2></div></div>`}
function hero(s,kind){return `<article class="slide ${kind}">${img(s)}<div class="hero-overlay"></div><div class="hero-content">${kind==='cover'?'<span class="hero-badge">공인중개사 1차 · 제1과목</span>':''}<h2 class="hero-title">${esc(s.title)}</h2><p class="hero-sub">${esc(s.subtitle||'')}</p>${s.note?`<p class="hero-note">${esc(s.note)}</p>`:''}</div></article>`}
function render(s,i){
 if(s.type==='cover'||s.type==='chapter'||s.type==='ending')return hero(s,s.type);
 let body='';
 if(s.type==='boxes')body=`<div class="${s.boxes.length===3?'grid-3':'grid-2'}">${s.boxes.map(b=>`<section class="box ${b.accent||''}"><h3>${esc(b.title)}</h3><ul>${b.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>${s.footer?`<div class="table-note">${esc(s.footer)}</div>`:''}`;
 else if(s.type==='flow')body=`${s.lead?`<p style="margin:0 0 12px;color:var(--muted);font-size:15px">${esc(s.lead)}</p>`:''}<div class="flow">${s.steps.map((x,j)=>`${j?'<span class="flow-arrow">→</span>':''}<div class="flow-step">${esc(x)}</div>`).join('')}</div>${s.notes?`<div class="note-row">${s.notes.map(x=>`<span class="note-pill">${esc(x)}</span>`).join('')}</div>`:''}`;
 else if(s.type==='table')body=`<div class="table-wrap"><table class="ppt-table"><thead><tr>${s.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(cell).join('')}</tr>`).join('')}</tbody></table></div>${s.note?`<div class="table-note">${esc(s.note)}</div>`:''}`;
 else if(s.type==='concept_map')body=`<div class="concept-map"><section class="concept-branch"><h3>${esc(s.branches[0].title)}</h3><ul>${s.branches[0].items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><span class="concept-label">${esc(s.branches[0].label)}</span></section><div class="concept-center">${esc(s.center)}</div><section class="concept-branch"><h3>${esc(s.branches[1].title)}</h3><ul>${s.branches[1].items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><span class="concept-label">${esc(s.branches[1].label)}</span></section></div><div class="table-note" style="text-align:center;font-weight:800">${esc(s.footer)}</div>`;
 else if(s.type==='term_cards')body=`<div class="term-grid">${s.cards.map(x=>`<section class="term-card"><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p></section>`).join('')}</div>`;
 else if(s.type==='feature_cards')body=`<div class="feature-grid">${s.cards.map(x=>`<section class="feature-card"><h3>${esc(x.name)}</h3><p class="sub">${esc(x.sub)}</p><ul>${x.items.map(y=>`<li>${esc(y)}</li>`).join('')}</ul></section>`).join('')}</div>${s.footer?`<div class="table-note">${esc(s.footer)}</div>`:''}`;
 else if(s.type==='compare')body=`<div class="grid-2"><section class="box blue"><h3>${esc(s.left.title)}</h3><ul>${s.left.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="box green"><h3>${esc(s.right.title)}</h3><ul>${s.right.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section></div>`;
 else if(s.type==='formula')body=`<div class="formula-grid">${s.cards.map(x=>`<section class="formula-card"><div class="formula-label">${esc(x.label)}</div><div class="formula-main">${esc(x.formula)}</div><div class="formula-note">${esc(x.note)}</div></section>`).join('')}</div>`;
 else if(s.type==='timeline')body=`<div class="timeline">${s.items.map(x=>`<section class="time-card"><h3>${esc(x.name)}</h3><span class="time-period">${esc(x.period)}</span><p>${esc(x.desc)}</p></section>`).join('')}</div>`;
 else if(s.type==='cobweb')body=`<p style="margin:0 0 12px;color:var(--muted)">${esc(s.lead)}</p><div class="cobweb-grid"><section class="assume"><h3>기본 가정</h3><ul>${s.assumptions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><div class="cases">${s.cases.map(x=>`<section class="case"><h3>${esc(x.name)}</h3><strong>${esc(x.condition)}</strong><span>${esc(x.state)}</span></section>`).join('')}</div></div>`;
 else if(s.type==='theory_cards')body=`<div class="theory-grid">${s.cards.map(x=>`<section class="theory-card"><span class="name">${esc(x.name)}</span><h3>${esc(x.key)}</h3><p>${esc(x.desc)}</p></section>`).join('')}</div>`;
 else if(s.type==='urban_theory')body=`<div class="urban-grid"><section class="urban-card"><h3>버제스 · 동심원이론</h3><div class="diagram"><div class="rings"></div></div><p>중심업무지구 → 천이지대 → 근로자 주택지대 → 중산층 주택지대 → 통근자 지대</p></section><section class="urban-card"><h3>호이트 · 선형이론</h3><div class="diagram"><div class="sector"></div></div><p>도로망을 따라 동질적인 토지이용이 부채꼴 모양으로 확장</p></section><section class="urban-card"><h3>다핵심이론</h3><div class="diagram"><div class="nuclei"><i class="nucleus"></i><i class="nucleus"></i><i class="nucleus"></i><i class="nucleus"></i></div></div><p>도시가 성장하면서 여러 개의 분리된 핵심으로 구성</p></section></div>`;
 else if(s.type==='cashflow')body=`<div class="cashflow">${s.steps.map(x=>`<div class="cash-row"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;
 else if(s.type==='principles')body=`<div class="principle-grid">${s.items.map(x=>`<section class="principle"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></section>`).join('')}</div>`;
 else if(s.type==='valuation')body=`<div class="val-grid"><section class="val-card"><h3>원가방식</h3><div class="theme">비용성</div><ul><li>원가법 → 적산가치</li><li>적산법 → 적산임료</li><li>공급가격 측면</li></ul></section><section class="val-card"><h3>비교방식</h3><div class="theme">시장성</div><ul><li>거래사례비교법 → 비준가치</li><li>임대사례비교법 → 비준임료</li><li>시장가격 측면</li></ul></section><section class="val-card"><h3>수익방식</h3><div class="theme">수익성</div><ul><li>수익환원법 → 수익가치</li><li>수익분석법 → 수익임료</li><li>수요가격 측면</li></ul></section></div>`;
 else if(s.type==='tax_incidence')body=`<div class="tax-grid">${['수요','공급'].map(t=>`<section class="tax-card"><h3>${t}</h3>${s.rows.filter(r=>r[0]===t).map(r=>`<div class="tax-line"><b>${esc(r[1])}</b><span>${esc(r[2])} · ${esc(r[3])}</span></div>`).join('')}</section>`).join('')}</div><div class="table-note">${esc(s.note)}</div>`;
 return `<article class="slide">${head(s)}<div class="slide-body">${body}</div>${foot(i)}</article>`;
}
let idx=0,rendered=-1,touchX=null,touchY=null;
const prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar'),modal=document.getElementById('modal'),list=document.getElementById('tocList');
function update(){idx=Math.max(0,Math.min(idx,D.slides.length-1));if(rendered!==idx){S.innerHTML=render(D.slides[idx],idx);rendered=idx}prev.disabled=idx===0;next.disabled=idx===D.slides.length-1;count.textContent=`${idx+1} / ${D.slides.length}`;bar.style.width=`${((idx+1)/D.slides.length)*100}%`;try{localStorage.setItem('gichulIntroSlideV141',String(idx))}catch{}history.replaceState(null,'',`#${idx+1}`)}
function go(n){const x=Math.max(0,Math.min(n,D.slides.length-1));if(x===idx)return;idx=x;rendered=-1;update()}
prev.onclick=()=>go(idx-1);next.onclick=()=>go(idx+1);document.getElementById('toc').onclick=()=>modal.classList.remove('hidden');document.getElementById('close').onclick=()=>modal.classList.add('hidden');modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')}
D.slides.forEach((s,i)=>{if(!['cover','chapter','ending'].includes(s.type))return;const b=document.createElement('button');b.className='toc-item';b.innerHTML=`<strong>${esc(s.title)}</strong><span>${i+1} / ${D.slides.length}</span>`;b.onclick=()=>{modal.classList.add('hidden');go(i)};list.appendChild(b)})
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx-1);else if(e.key==='ArrowRight'||e.key===' ')go(idx+1);else if(e.key==='Escape')modal.classList.add('hidden')})
S.addEventListener('touchstart',e=>{let t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY},{passive:true});S.addEventListener('touchend',e=>{if(touchX==null)return;let t=e.changedTouches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;touchX=touchY=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)go(idx+(dx<0?1:-1))},{passive:true})
const sizes={small:'15px',normal:'17px',large:'20px'};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--body',sizes[b.dataset.size]);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));try{localStorage.setItem('gichulIntroSlideFontV141',b.dataset.size)}catch{}})
let start=Number(location.hash.slice(1))-1;if(!Number.isFinite(start)||start<0||start>=D.slides.length){try{start=Number(localStorage.getItem('gichulIntroSlideV141'))}catch{start=0}}idx=Number.isFinite(start)&&start>=0&&start<D.slides.length?start:0;
try{let sz=localStorage.getItem('gichulIntroSlideFontV141')||'normal';if(sizes[sz]){document.documentElement.style.setProperty('--body',sizes[sz]);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x.dataset.size===sz))}}catch{}
update();
})();
</script>
</body>
