<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>공인중개사 핵심요약</title>
  <link rel="stylesheet" href="slides_design_v1.css" />
</head>
<body>
  <main class="summary-app">
    <header class="summary-topbar">
      <a class="site-back" href="../index.html" aria-label="문제풀이로 돌아가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <span>문제풀이</span>
      </a>
      <div class="brand-block">
        <span class="brand-kicker">공인중개사</span>
        <h1>핵심요약</h1>
      </div>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <section id="subjectView" class="subject-view">
      <div class="intro-card">
        <div>
          <p class="eyebrow">STUDY NOTES</p>
          <h2>과목을 골라서 바로 이어서 봐</h2>
          <p>총 6과목 · 498장. 마지막으로 본 페이지는 이 기기에 자동 저장돼.</p>
        </div>
        <div class="intro-count"><strong>498</strong><span>SLIDES</span></div>
      </div>
      <div id="subjectGrid" class="summary-subject-grid" aria-label="핵심요약 과목"></div>
    </section>

    <section id="viewerView" class="viewer-view hidden" aria-live="polite">
      <div class="viewer-head">
        <button id="subjectBackBtn" class="icon-text-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span>과목</span>
        </button>
        <div class="viewer-title-wrap">
          <span id="viewerKicker" class="viewer-kicker">핵심요약</span>
          <h2 id="viewerTitle">민법</h2>
        </div>
        <button id="fullscreenBtn" class="icon-btn" type="button" aria-label="크게 보기" title="크게 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
      </div>

      <div class="viewer-progress-row">
        <div class="viewer-progress-track" aria-hidden="true"><div id="viewerProgressFill" class="viewer-progress-fill"></div></div>
        <span id="viewerCounter" class="viewer-counter">1 / 89</span>
      </div>

      <div id="slideStage" class="slide-stage" tabindex="0" aria-label="핵심요약 슬라이드">
        <button id="prevOverlayBtn" class="slide-overlay-nav prev" type="button" aria-label="이전 페이지">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <img id="slideImage" class="slide-image" src="" alt="" draggable="false" />
        <button id="nextOverlayBtn" class="slide-overlay-nav next" type="button" aria-label="다음 페이지">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <p class="mobile-view-hint">휴대폰에서는 가로 화면이나 <strong>크게 보기</strong>가 가장 읽기 편해.</p>

      <nav class="viewer-controls" aria-label="슬라이드 이동">
        <button id="prevBtn" class="nav-btn secondary" type="button">이전</button>
        <label class="jump-box">
          <span>페이지</span>
          <input id="pageInput" type="number" inputmode="numeric" min="1" value="1" aria-label="이동할 페이지" />
          <span id="pageTotal">/ 89</span>
        </label>
        <button id="nextBtn" class="nav-btn primary" type="button">다음</button>
      </nav>
    </section>
  </main>

  <script src="slides_design_v1_manifest.js"></script>
  <script src="slides_design_v1.js"></script>
</body>
</html>
