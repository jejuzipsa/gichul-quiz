name: UI dark mode review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check word-quiz/quiz.js
          node --check word-quiz/blank-quiz.js
      - name: Validate dark-mode hooks and palette
        run: node tools/ui/validate-dark-mode.cjs
      - name: Test responsive reading-size control
        run: node --test tools/ui/validate-reading-size.cjs
