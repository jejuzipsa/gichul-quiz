name: Law search API review

on:
  push:
    branches: [main]
    paths:
      - 'api/law-search.js'
      - 'law-search/**'
      - 'tools/law-search/**'
      - '.github/workflows/law-search-review.yml'
  pull_request:
    paths:
      - 'api/law-search.js'
      - 'law-search/**'
      - 'tools/law-search/**'
      - '.github/workflows/law-search-review.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/law-search.js
      - run: node --check law-search/law-search.js
      - run: node --test tools/law-search/test.cjs
