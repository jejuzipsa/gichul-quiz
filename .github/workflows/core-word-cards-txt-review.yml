name: Core word cards TXT review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exam frequency metadata
        run: node tools/core-cards/reindex.cjs --check
      - name: Check TXT source mirror
        run: node tools/core-cards/compile.cjs --check
      - name: Validate reviewed card bank
        run: node tools/core-cards/validate.cjs
      - name: Audit card content risk flags
        run: node tools/core-cards/audit-content.cjs
      - name: Check JavaScript syntax
        run: |
          node --check core-cards/data.js
          node --check core-cards/data-public.js
          node --check core-cards/data-registration.js
          node --check core-cards/data-tax.js
          node --check core-cards/cards.js
