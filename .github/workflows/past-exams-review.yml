name: Past exams TXT review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check TXT source mirrors
        run: node tools/past-exams/compile.cjs --check
      - name: Validate 2021-2025 past exam release
        run: node tools/past-exams/validate.cjs --release
