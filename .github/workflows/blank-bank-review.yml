name: Blank bank review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/blank-bank/validate.cjs
      - run: node tools/blank-bank/test.cjs
  content-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/blank-bank/validate.cjs --release
