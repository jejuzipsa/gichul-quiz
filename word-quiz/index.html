<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7fb" />
  <script>
  (()=>{
    const key='gichulQuizTheme';
    try{
      const saved=localStorage.getItem(key);
      const theme=(saved==='dark'||saved==='light')?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
    }catch(_){document.documentElement.dataset.theme='light';}
  })();
  </script>
  <link rel="icon" type="image/png" href="../assets/property-icon.png?v=2.26" />
  <title>핵심 개념 퀴즈</title>
  <link rel="stylesheet" href="quiz.css?v=1.8" />
  <link rel="stylesheet" href="blank-quiz.css?v=1.4" />
</head>
<body>
  <main class="quiz-shell">
    <header class="quiz-topbar">
      <a class="home-link" href="../index.html" aria-label="기출문제 홈으로">← 홈</a>
      <div><p class="eyebrow">핵심 개념 퀴즈</p><h1 id="subjectTitle">핵심 개념 퀴즈</h1></div>
      <div class="quiz-topbar-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="다크모드 켜기" title="다크모드 켜기" aria-pressed="false">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
        </button>
        <button id="newSetTopBtn" class="soft-btn" type="button">새 문제</button>
      </div>
    </header>
    <section id="playView">
      <div class="quiz-status"><div class="status-line"><strong id="progressText">1 / 10</strong><span id="categoryText"></span></div><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div></div>
      <article id="questionCard" class="question-card"><div class="question-kicker" id="questionNumber">문제 1</div><h2 id="questionText"></h2><div id="choices" class="choices"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="nextBtn" class="primary-btn hidden" type="button">다음 문제</button></div></article>
    </section>
    <section id="resultView" class="hidden">
      <article class="result-card"><p class="eyebrow">퀴즈 결과</p><h2 id="resultHeadline">문제 풀이 완료</h2><p id="resultScore" class="result-score"></p><div id="resultBar" class="result-bar"><span></span></div><div class="result-actions"><button id="retryWrongBtn" class="primary-btn" type="button">틀린 문제 다시 풀기</button><button id="newSetBtn" class="secondary-btn" type="button">새 문제</button><a class="secondary-btn link-btn" href="../index.html">홈으로</a></div></article>
      <section id="answerSummarySection" class="answer-summary-section hidden"><div class="answer-summary-head"><h2>이번 10문제 정답 정리</h2><p class="answer-summary-legend">파랑: 처음부터 정답 · 빨강: 오답 복습한 문제</p></div><div id="answerSummaryList" class="answer-summary-list"></div></section>
      <section id="wrongSection" class="wrong-section"><div class="wrong-head"><h2>틀린 문제</h2><span id="wrongCount"></span></div><div id="wrongList" class="wrong-list"></div></section>
    </section>
  </main>
  <script>
  (()=>{
    const THEME_KEY='gichulQuizTheme';
    const themeBtn=document.getElementById('themeToggleBtn');
    const systemTheme=()=>matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    const applyTheme=(theme,persist=false)=>{
      const next=theme==='dark'?'dark':'light';
      document.documentElement.dataset.theme=next;
      document.documentElement.style.colorScheme=next;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content',next==='dark'?'#080d18':'#f5f7fb');
      if(themeBtn){
        const dark=next==='dark';
        themeBtn.setAttribute('aria-pressed',dark?'true':'false');
        themeBtn.setAttribute('aria-label',dark?'라이트모드 켜기':'다크모드 켜기');
        themeBtn.title=dark?'라이트모드 켜기':'다크모드 켜기';
      }
      if(persist){try{localStorage.setItem(THEME_KEY,next)}catch(_){}}
    };
    let savedTheme=null;
    try{savedTheme=localStorage.getItem(THEME_KEY)}catch(_){}
    applyTheme(savedTheme==='dark'||savedTheme==='light'?savedTheme:systemTheme());
    themeBtn?.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true));
    try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{if(!localStorage.getItem(THEME_KEY))applyTheme(e.matches?'dark':'light')})}catch(_){}

    const subjects={
      real_estate_intro:'real_estate_intro.js',
      civil_law:'civil_law.js',
      brokerage_law:'brokerage_law.js',
      public_law:'public_law.js',
      registration_law:'registration_law.js',
      tax_law:'tax_law.js'
    };
    const params=new URLSearchParams(location.search);
    const requestedKey=params.get('subject')||'real_estate_intro';
    const key=Object.hasOwn(subjects,requestedKey)?requestedKey:'real_estate_intro';
    const mode=params.get('mode')==='blank'?'blank':'standard';
    const file=subjects[key]||subjects.real_estate_intro;

    const fail=(kind)=>{
      document.body.innerHTML=`<main class="quiz-shell"><article class="result-card"><h1>${kind} 데이터를 불러오지 못했습니다.</h1><a class="secondary-btn" href="../index.html">홈으로</a></article></main>`;
    };
    const load=(src,onload,onerror)=>{
      const script=document.createElement('script');
      script.src=src;
      script.onload=onload||null;
      script.onerror=onerror||(()=>fail('문제'));
      document.body.appendChild(script);
    };

    if(mode==='blank'){
      load(`blank-data/${file}?v=20261010-blank-v30`,()=>{
        load('blank-bank-validator.js?v=20261010-blank-v30',()=>{
          if(!window.validateBlankBank(window.BLANK_QUIZ_BANK,key)) return fail('괄호문제');
          load('blank-session.js?v=20261010-blank-v30',()=>{
            load('blank-quiz.js?v=20261010-blank-v30',null,()=>fail('괄호문제'));
          },()=>fail('괄호문제'));
        },()=>fail('괄호문제'));
      },()=>fail('괄호문제'));
    }else{
      load(`data/${file}?v=20261010-core-v31`,()=>{
        load('quiz.js?v=1.8',null,()=>fail('문제'));
      },()=>fail('문제'));
    }
  })();
  </script>
</body>
</html>
